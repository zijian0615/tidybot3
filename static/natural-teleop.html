<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
body{font-family:system-ui;margin:0;background:#111;color:#eee;text-align:center;touch-action:none}#status,#trackStatus{padding:8px;background:#333;min-height:22px}#trackStatus{background:#202020;color:#ffd54f}.controls{display:flex;justify-content:center;gap:8px;margin:6px}.controls button{font-size:17px;padding:10px 14px;background:#1976d2;color:#fff;border:0;border-radius:10px}.controls button:disabled{background:#555}
#cameraBox{width:min(92vw,520px);height:170px;margin:7px auto;position:relative;overflow:hidden;background:#000;border-radius:10px}#video,#overlay{position:absolute;width:100%;height:100%;left:0;top:0;object-fit:cover}#overlay{z-index:2}
#pad{width:min(60vw,285px);height:min(60vw,285px);margin:6px auto;border-radius:50%;background:#262626;border:3px solid #777;position:relative}#knob{width:66px;height:66px;border-radius:50%;background:#42a5f5;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}button.turn{font-size:25px;padding:11px 30px;margin:3px;background:#555;color:white;border:0;border-radius:12px}#armHold{font-size:19px;padding:14px 24px;margin:5px;background:#8b1e1e;color:white;border:0;border-radius:12px}.active{background:#d84315!important}details{font-size:14px;color:#bbb}input{width:75px;font-size:16px}small{display:block;padding:5px;color:#bbb}
</style></head><body><div id="status">连接中；松手即停</div><div class="controls"><button id="startCamera">启动相机</button><button id="lock" disabled>锁定环境</button></div><div id="trackStatus">正在加载视觉模块…</div>
<div id="cameraBox"><video id="video" playsinline muted></video><canvas id="overlay"></canvas></div><button id="armHold" disabled>按住启用机械臂</button><div id="pad"><div id="knob"></div></div><button class="turn" id="left">↺</button><button class="turn" id="right">↻</button><small>先锁定环境；按住红色按钮并移动手机；摇杆控制底盘</small>
<details><summary>视觉设置</summary><label>锁定时到平面的距离 mm <input id="planeDistance" type="number" value="800" min="200" max="3000"></label><label>水平视场角 ° <input id="fov" type="number" value="64" min="35" max="100"></label><div>距离决定平移尺度。建议实测，并用已知 100 mm 移动校准。</div></details>
<canvas id="work" width="480" height="360" hidden></canvas><script>window.TELEOP_TOKEN='__SESSION_TOKEN__'</script><script src="/static/natural/jsfeat-min.js"></script><script src="/static/natural/teleop.js"></script></body></html>
